name: CI

on:
  push:
    branches: [main]
  pull_request:

# Una corrida por ref en el runner self-hosted (único).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `dorny/paths-filter` necesita leer los archivos del PR: sin `pull-requests: read`
# el default del repo (read de contents) responde "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

jobs:
  # Detecta qué cambió para no correr todo en cada PR (path filters). Un cambio en
  # los workflows corre todo, para que se pruebe de verdad. Por ejemplo, los PR de
  # Dependabot que suben versiones de actions.
  changes:
    runs-on: [self-hosted, linux, x64]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      panel: ${{ steps.filter.outputs.panel }}
      tokens: ${{ steps.filter.outputs.tokens }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            panel:
              - 'apps/panel-web/**'
              - '.github/workflows/**'
            tokens:
              - 'brand/tokens/**'
              - 'apps/panel-web/app/tokens.css'
              - '.github/workflows/**'

  tokens:
    needs: changes
    if: ${{ needs.changes.outputs.tokens == 'true' }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Igual que el Dockerfile (node:22-alpine). jsdom 30 exige >= 22.22.2:
          # check-latest evita que el caché del runner sirva una 22.x más vieja.
          node-version: "22"
          check-latest: true
      - name: Generar tokens
        run: node brand/tokens/build.mjs
      - name: Verificar que los generados están al día
        run: git diff --exit-code -- brand/tokens
      - name: Contraste WCAG de los temas (texto ≥ 4,5:1, no texto ≥ 3:1)
        run: node brand/tokens/contrast.mjs
      - name: El panel usa la copia al día de tokens.css
        run: diff -u brand/tokens/tokens.css apps/panel-web/app/tokens.css

  panel:
    needs: changes
    if: ${{ needs.changes.outputs.panel == 'true' }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Igual que el Dockerfile (node:22-alpine). jsdom 30 exige >= 22.22.2:
          # check-latest evita que el caché del runner sirva una 22.x más vieja.
          node-version: "22"
          check-latest: true
      - name: Instalar
        working-directory: apps/panel-web
        run: npm ci
      - name: Typecheck
        working-directory: apps/panel-web
        run: npm run typecheck
      - name: Lint
        working-directory: apps/panel-web
        run: npm run lint
      - name: Build
        working-directory: apps/panel-web
        run: npm run build
      - name: Tests (con cobertura)
        working-directory: apps/panel-web
        run: npm run test:coverage
      - name: Publicar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-panel
          path: apps/panel-web/coverage
          if-no-files-found: ignore

  # Deriva de tipos (HU-UI-04): lib/api/schema.d.ts debe coincidir con el OpenAPI de
  # `develop` de agent-core. agent-core es privado: el checkout usa el secreto
  # AGENT_CORE_READ_TOKEN (token de solo lectura del contenido de ese repo). Sin el
  # secreto, el job avisa y no bloquea, para no romper el CI mientras se configura.
  api-types:
    needs: changes
    if: ${{ needs.changes.outputs.panel == 'true' }}
    runs-on: [self-hosted, linux, x64]
    env:
      HAS_TOKEN: ${{ secrets.AGENT_CORE_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Falta el secreto AGENT_CORE_READ_TOKEN
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::Sin AGENT_CORE_READ_TOKEN no se puede verificar la deriva de tipos contra agent-core."
      - name: OpenAPI de agent-core (develop)
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          repository: devrochy/agent-core
          ref: develop
          token: ${{ secrets.AGENT_CORE_READ_TOKEN }}
          path: agent-core
          sparse-checkout: docs/openapi.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        if: env.HAS_TOKEN == 'true'
        with:
          # Igual que el Dockerfile (node:22-alpine). jsdom 30 exige >= 22.22.2:
          # check-latest evita que el caché del runner sirva una 22.x más vieja.
          node-version: "22"
          check-latest: true
      - name: Instalar
        if: env.HAS_TOKEN == 'true'
        working-directory: apps/panel-web
        run: npm ci
      - name: Los tipos del panel coinciden con el OpenAPI
        if: env.HAS_TOKEN == 'true'
        working-directory: apps/panel-web
        env:
          OPENAPI_PATH: ${{ github.workspace }}/agent-core/docs/openapi.json
        run: npm run api:types:check

  # Escaneo de secretos sobre la historia (falla si aparece una credencial real).
  secret-scan:
    runs-on: [self-hosted, linux, x64]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks (secret scan)
        # Binario fijado en $RUNNER_TEMP: sin caché ni /tmp (que dejaba trabado
        # a `gitleaks-action` en el runner self-hosted).
        run: |
          VER=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitleaks" detect --source . --redact -v
